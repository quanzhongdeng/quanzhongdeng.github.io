        const DualText = ({ en, cn, className = "", large = false }) => (
            <div className={`flex flex-col items-start text-left ${className}`}>
                <span className={`block font-serif tracking-wide ${large ? 'text-4xl md:text-6xl lg:text-7xl font-light italic text-white' : 'text-xl md:text-2xl text-white'}`}>
                    {en}
                </span>

                </span>
            </div>
        );

        // --- 作品数据源 ---
        const WORKS_DATA = [
            {
                id: 1, year: "2025", duration: "5:00",
                titleEn: "Breath of the Earth", titleCn: "大地之息",
                instrumentationEn: "Piano Trio", instrumentationCn: "钢琴三重奏",
                audioSrc: "./audio/breath_of_the_earth.mp3",

                time: "July 11, 2025 / 2025年7月11日",
                location: "Univ. of Oregon, Tykeson Music Hall / 俄勒冈大学泰克森音乐厅"
            },
            {
                id: 2, year: "2025", duration: "11:00",
                titleEn: "Within the Valley Too", titleCn: "空谷之中 II",
                instrumentationEn: "Shakuhachi & Electronics", instrumentationCn: "尺八与电子音乐",
                audioSrc: "./audio/within_the_valley.mp3",
                performer: "Shakuhachi: Haoyu Zhao, Elec: Quanzhong Deng / 尺八：赵浩宇",
                time: "Nov 14, 2025 / 2025年11月14日",
                location: "James C. Olson PAC, White Recital Hall / 奥尔森表演艺术中心"
            },
            {
                id: 3, year: "2025", duration: "7:00",
                titleEn: "Resonance of Elapsing Moments", titleCn: "逝响",
                instrumentationEn: "Mixed Quartet", instrumentationCn: "混合四重奏",
                audioSrc: "./audio/resonance.mp3",
                performer: "Reheard Ensemble",
                time: "19:30, June 3, 2025 / 2025年6月3日",
                location: "Masterskaya M. K. Anikushina / 俄罗斯圣彼得堡"
            },
            {
                id: 4, year: "2023", duration: "9:00",
                titleEn: "Yi Chou Er Dan", titleCn: "一丑二旦",
                instrumentationEn: "Solo Piano", instrumentationCn: "钢琴独奏",
                audioSrc: "./audio/yi_chou_er_dan.mp3",
                performer: "Piano: Xueyan Duan / 钢琴：段雪妍",
                time: "2:45 PM, Apr 5, 2025 / 2025年4月5日",
                location: "Swarthout Recital Hall, Univ. of Kansas / 堪萨斯大学音乐厅"
            },
            {
                id: 5, year: "2024", duration: "8:00",
                titleEn: "The Third Color Upon the Sea", titleCn: "海面上的第三种颜色",
                instrumentationEn: "String Quartet", instrumentationCn: "弦乐四重奏",
                audioSrc: "./audio/third_color.mp3",
                performer: "Del Sol Quartet",
                time: "Mar 4, 2025 / 2025年3月4日",
                location: "James C. Olson Performing Arts Center / 奥尔森表演艺术中心"
            }
        ];

        // --- 核心 APP ---
        const App = () => {
            const [scrolled, setScrolled] = useState(false);
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            
            const audioRef = useRef(null);
            const [currentTrack, setCurrentTrack] = useState(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [progress, setProgress] = useState(0);
            const [currentTime, setCurrentTime] = useState("0:00");
            const [duration, setDuration] = useState("0:00");
            
            const [volume, setVolume] = useState(1);
            const canvasRef = useRef(null);
            const audioCtxRef = useRef(null);
            const analyserRef = useRef(null);
            const sourceRef = useRef(null);
            const animationRef = useRef(null);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const formatTime = (time) => {
                if (isNaN(time)) return "0:00";
                const mins = Math.floor(time / 60);
                const secs = Math.floor(time % 60);
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            };

            const initAudioContext = () => {
                if (window.location.protocol === 'file:') {
                    console.warn("检测到本地 file:/// 预览，波形显示器已暂停，以确保音频能正常发声。上传至 GitHub 后波形会自动恢复！");
                    return; 
                }

                if (!audioCtxRef.current && audioRef.current) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtxRef.current = new AudioContext();
                    analyserRef.current = audioCtxRef.current.createAnalyser();
                    // 【升级 1】：极高分辨率！4096 能在低中频部分提供 4 倍的原始数据点，彻底打碎块状感
                    analyserRef.current.fftSize = 4096; 
                    analyserRef.current.smoothingTimeConstant = 0.85; 
                    
                    sourceRef.current = audioCtxRef.current.createMediaElementSource(audioRef.current);
                    sourceRef.current.connect(analyserRef.current);
                    analyserRef.current.connect(audioCtxRef.current.destination);
                }
                if (audioCtxRef.current?.state === 'suspended') {
                    audioCtxRef.current.resume();
                }
            };

            // 绘制终极版波形：高精度 FFT + 线性插值平滑 + 镜像倒影
            const drawWaveform = () => {
                if (!analyserRef.current || !canvasRef.current) return;
                
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const bufferLength = analyserRef.current.frequencyBinCount; // 此时为 2048
                const dataArray = new Uint8Array(bufferLength);
                
                analyserRef.current.getByteFrequencyData(dataArray);
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 【升级 2】：柱子数量从 150 提升到 350，画面变得极其细密
                const numBars = 350;
                const barWidth = canvas.width / numBars;
                let x = 0;
                
                // 跳过低频直流噪点，4096 下的 0.25 大约是 11025Hz，刚好覆盖极高频空气音
                const minFreqBin = 2; 
                const maxFreqBin = Math.floor(bufferLength * 0.25); 
                
                const minLog = Math.log(minFreqBin);
                const maxLog = Math.log(maxFreqBin);
                
                for (let i = 0; i < numBars; i++) {
                    const exactBin = Math.exp(minLog + (i / numBars) * (maxLog - minLog));
                    
                    // 【升级 3：核心平滑插值算法】
                    // 不再粗暴地向下取整，而是根据两个数据点之间的距离，计算出平滑的坡度曲线，消灭阶梯方块
                    const binLow = Math.floor(exactBin);
                    const binHigh = Math.min(Math.ceil(exactBin), bufferLength - 1);
                    const binFraction = exactBin - binLow;
                    
                    const valLow = dataArray[binLow];
                    const valHigh = dataArray[binHigh];
                    const interpolatedValue = valLow + (valHigh - valLow) * binFraction;
                    
                    const percent = interpolatedValue / 255;
                    
                    const halfBarHeight = Math.max(percent * (canvas.height / 2), 1);
                    const totalBarHeight = halfBarHeight * 2; 
                    const y = (canvas.height / 2) - halfBarHeight; 
                    
                    ctx.fillStyle = `rgba(212, 175, 55, ${percent * 0.6 + 0.15})`; 
                    // 间距设为极其微小的 0.5px，让波形紧密连贯又保留了独立线柱的工业感
                    ctx.fillRect(x, y, barWidth - 0.5, totalBarHeight);
                    x += barWidth;
                }
                animationRef.current = requestAnimationFrame(drawWaveform);
            };

            useEffect(() => {
                if (isPlaying) {
                    animationRef.current = requestAnimationFrame(drawWaveform);
                } else {
                    if (animationRef.current) cancelAnimationFrame(animationRef.current);
                }
                return () => {
                    if (animationRef.current) cancelAnimationFrame(animationRef.current);
                }
            }, [isPlaying, currentTrack]);

            const playTrack = (track) => {
                initAudioContext();
                if (currentTrack?.id === track.id) {
                    togglePlay(); 
                } else {
                    setCurrentTrack(track);
                    setIsPlaying(true);
                }
            };

            useEffect(() => {
                if (currentTrack && audioRef.current) {
                    audioRef.current.src = currentTrack.audioSrc;
                    audioRef.current.play().catch(e => console.log("Audio play prevented:", e));
                    setIsPlaying(true);
                }
            }, [currentTrack]);

            const togglePlay = () => {
                initAudioContext();
                if (audioRef.current) {
                    if (isPlaying) {
                        audioRef.current.pause();
                    } else {
                        audioRef.current.play();
                    }
                    setIsPlaying(!isPlaying);
                }
            };

            const handleVolumeChange = (e) => {
                const val = parseFloat(e.target.value);
                setVolume(val);
                if (audioRef.current) audioRef.current.volume = val;
            };

            const onTimeUpdate = () => {
                if (audioRef.current) {
                    const curr = audioRef.current.currentTime;
                    const dur = audioRef.current.duration;
                    setProgress((curr / dur) * 100 || 0);
                    setCurrentTime(formatTime(curr));
                    setDuration(formatTime(dur));
                }
            };

            const handleSeek = (e) => {
                if (audioRef.current) {
                    const seekTo = (e.target.value / 100) * audioRef.current.duration;
                    audioRef.current.currentTime = seekTo;
                    setProgress(e.target.value);
                }
            };

            const closePlayer = () => {
                if (audioRef.current) audioRef.current.pause();
                setIsPlaying(false);
                setCurrentTrack(null);
            };

            return (
                <div className="bg-void selection:bg-gold-muted selection:text-black relative pb-24">
                    
                    <audio 
                        ref={audioRef} 
                        onTimeUpdate={onTimeUpdate} 
                        onEnded={() => setIsPlaying(false)}
                    />

                    {/* Navigation */}
                    <nav className={`fixed w-full z-40 transition-all duration-500 ${scrolled ? 'liquid-glass py-4' : 'bg-gradient-to-b from-black/80 via-black/20 to-transparent py-8'}`}>
                        <div className="container mx-auto px-6 flex justify-between items-center drop-shadow-md">
                            <a href="#" className={`font-serif text-2xl tracking-widest text-white hover:text-gold-muted transition-all duration-500 cursor-pointer block ${scrolled ? 'opacity-100 translate-x-0' : 'opacity-0 -translate-x-4 pointer-events-none'}`}>
                                Quanzhong <span className="text-gold-muted">Deng</span>
                            </a>
                            <div className="hidden md:flex gap-12 text-xs tracking-[0.2em] font-sans text-gray-400 uppercase font-bold">
                                <a href="#biography" className="hover:text-white transition-colors drop-shadow-lg">Bio / 简介</a>
                                <a href="#works" className="hover:text-white transition-colors drop-shadow-lg">Works / 作品</a>
                                <a href="#schedule" className="hover:text-white transition-colors drop-shadow-lg">Schedule / 日程</a>
                                <a href="#contact" className="hover:text-white transition-colors drop-shadow-lg">Contact / 联络</a>
                            </div>

                                <div className="space-y-1.5">
                                    <div className={`w-6 h-px bg-white transition-all duration-300 ${isMenuOpen ? 'rotate-45 translate-y-1.5 bg-gold-muted' : ''}`}></div>
                                    <div className={`w-6 h-px bg-white transition-all duration-300 ${isMenuOpen ? 'opacity-0' : 'opacity-100'}`}></div>
                                    <div className={`w-6 h-px bg-white transition-all duration-300 ${isMenuOpen ? '-rotate-45 -translate-y-2 bg-gold-muted' : ''}`}></div>
                                </div>
                            </div>
                        </div>
                    </nav>

                    {/* 移动端菜单 */}
